name: Build Server

on:
  push:
    branches: [master]
    paths:
      - 'src/Snacka.Server/**'
      - 'src/Snacka.Shared/**'
      - 'src/Snacka.WebRTC/**'
      - 'Dockerfile'
      - 'packaging/server/**'
      - 'client/ui/**'
      - '.github/workflows/build-server.yml'
    tags:
      - 'v*'  # Tags always trigger, paths filter only applies to branches
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress builds when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Self-hosting bundles (#53): the server, LiveKit, the web client and start scripts in one zip
  # per platform, for hosts who don't use Docker. See packaging/server/README.txt.
  bundle:
    name: Server bundle (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, livekit: linux_amd64, os: ubuntu-latest }
          - { rid: linux-arm64, livekit: linux_arm64, os: ubuntu-latest }
          - { rid: win-x64, livekit: windows_amd64, os: ubuntu-latest }
          # LiveKit publishes no macOS binary and needs cgo there: built from source on a Mac.
          - { rid: osx-arm64, livekit: darwin_arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/ui/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        if: startsWith(matrix.livekit, 'darwin')
        with:
          go-version: stable

      - name: Build the web client
        working-directory: client/ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Package
        run: packaging/server/package.sh ${{ matrix.rid }} ${{ matrix.livekit }} "$RUNNER_TEMP/bundle"

      # Start it the way a host would and check the server, the web client and LiveKit come up.
      - name: Smoke test
        if: matrix.rid == 'linux-x64'
        run: |
          cd "$RUNNER_TEMP/bundle/snacka-server-linux-x64"
          ./start.sh > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5117/api/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5117/ | grep -q '<div id="root">'
          for i in $(seq 1 20); do grep -q "Bundled LiveKit running" server.log && break; sleep 1; done
          curl -s -o /dev/null -w "%{http_code}" http://localhost:5117/livekit/rtc/validate | grep -q 401
          grep -q "Invite code\|invite code" server.log
          cat server.log

      - uses: actions/upload-artifact@v4
        with:
          name: snacka-server-${{ matrix.rid }}
          path: ${{ runner.temp }}/bundle/snacka-server-${{ matrix.rid }}.zip
          if-no-files-found: error
