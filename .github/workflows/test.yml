name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Snacka.sln

      - name: Build
        run: dotnet build Snacka.sln --no-restore -c Release

      # --blame-hang-timeout guards against the Avalonia headless hang seen in Jan 2026:
      # a hung test run is killed and a dump is captured instead of burning the job timeout.
      - name: Test
        run: >
          dotnet test Snacka.sln --no-build -c Release
          --logger GitHubActions
          --logger trx
          --results-directory TestResults
          --blame-hang-timeout 5m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  # The new client (client/ui) against a real server, LiveKit and Chrome: the Alice & Bob
  # Playwright tests (#23) that replace manual testing.
  client-e2e:
    name: Client e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snacka
          POSTGRES_PASSWORD: snacka
          POSTGRES_DB: snacka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snacka -d snacka"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: client/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/ui/pnpm-lock.yaml

      - name: Install, typecheck, lint, build
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm lint
          pnpm build

      # The server runs LiveKit itself, as a self-hosted server does (#53): the binary next to it,
      # generated keys, signaling through the server's port.
      - name: Download LiveKit
        working-directory: .
        run: |
          curl -sSfL https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" livekit-server
          echo "LIVEKIT_BINARY=$RUNNER_TEMP/livekit-server" >> "$GITHUB_ENV"

      - name: Start server
        working-directory: .
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=snacka;Username=snacka;Password=snacka
          # Clear the development LiveKit settings so the bundled one is used.
          LiveKit__Url: ""
          LiveKit__ApiKey: ""
          LiveKit__ApiSecret: ""
          Logging__LogLevel__Snacka.Server.Services.BundledLiveKitService: Debug
        run: |
          export LiveKit__Binary="$LIVEKIT_BINARY"
          export JWT_SECRET_KEY="$(openssl rand -base64 48)"
          dotnet build src/Snacka.Server -c Release -v q
          nohup dotnet run --no-build -c Release --project src/Snacka.Server --urls http://0.0.0.0:5117 > server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5117/api/health > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1

      # Uses the runner's preinstalled Google Chrome (playwright.config.ts: channel "chrome").
      - name: Playwright
        run: pnpm e2e

      - name: Logs and traces on failure
        if: failure()
        working-directory: .
        run: |
          grep -v "livekit:.*DEBUG" server.log | tail -n 300 || true

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: client/ui/test-results
          if-no-files-found: ignore

  vulnerable-packages:
    name: Vulnerable package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Snacka.sln

      # Warning-only until the known advisories are fixed (#12). Then switch ::warning to ::error and exit 1.
      - name: List vulnerable packages
        shell: bash
        run: |
          dotnet list Snacka.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning title=Vulnerable packages::Known-vulnerable NuGet packages found (tracked in #12). See job log."
          fi
